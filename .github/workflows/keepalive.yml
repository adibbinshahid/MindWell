name: Keep Alive

on:
  schedule:
    - cron: "0 9 */5 * *"   # every 5 days at 09:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping system-maintenance endpoint
        run: |
          RESPONSE=$(curl -sS -L -w "\n__STATUS__%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.KEEP_ALIVE_TOKEN }}" \
            "${{ secrets.SITE_URL }}/api/system-maintenance")

          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | sed 's/__STATUS__//')

          echo "Response body: $BODY"
          echo "HTTP status:   $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: expected 200, got $STATUS"
            exit 1
          fi
